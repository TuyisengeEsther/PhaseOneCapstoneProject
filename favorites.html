<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Favorites | Book Explorer</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#0F172A',
            accent: '#7C3AED',
            darkbg: '#020617'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-slate-100 dark:bg-darkbg text-black dark:text-white transition duration-300 min-h-screen flex flex-col">

  <!-- HEADER / NAVBAR -->
  <nav class="bg-primary shadow-lg sticky top-0 z-50">

    <div class="max-w-7xl mx-auto px-6">

      <div class="flex justify-between items-center h-16">

        <!-- LOGO -->
        <h1 class="text-2xl font-bold text-white">
          Book Explorer
        </h1>

        <!-- DESKTOP MENU -->
        <div class="hidden md:flex items-center gap-6">

          <a href="index.html"
            class="text-white hover:text-accent transition">
            Home
          </a>

          <a href="favorites.html"
            class="text-accent font-semibold">
            Favorites
          </a>

          <a href="about.html"
            class="text-white hover:text-accent transition">
            About
          </a>

          <!-- DARK MODE -->
          <button id="themeToggle"
            class="bg-accent hover:bg-purple-700 px-4 py-2 rounded-xl text-white transition">
            🌙
          </button>

        </div>

        <!-- HAMBURGER -->
        <button id="menuBtn"
          class="md:hidden text-white text-3xl">
          ☰
        </button>

      </div>

      <!-- MOBILE MENU -->
      <div id="mobileMenu"
        class="hidden md:hidden pb-5 space-y-4">

        <a href="index.html"
          class="block text-white">
          Home
        </a>

        <a href="favorites.html"
          class="block text-accent">
          Favorites
        </a>

        <a href="about.html"
          class="block text-white">
          About
        </a>

        <button id="mobileThemeToggle"
          class="bg-accent px-4 py-2 rounded-xl text-white w-full">
          Toggle Theme
        </button>

      </div>

    </div>

  </nav>

  <!-- HERO SECTION -->
  <section class="relative overflow-hidden">

    <div class="absolute inset-0 bg-gradient-to-r from-purple-900 via-slate-900 to-black opacity-95"></div>

    <div class="relative max-w-7xl mx-auto px-6 py-24 text-center">

      <h1 class="text-5xl md:text-7xl font-extrabold text-white mb-8 leading-tight">
        Your Favorite Books
      </h1>

      <p class="text-lg md:text-2xl text-gray-300 max-w-3xl mx-auto leading-9">
        Keep track of the books you love, revisit your favorite stories,
        and build your personal reading collection.
      </p>

    </div>

  </section>

  <!-- FAVORITES SECTION -->
  <main class="flex-grow">

    <section class="max-w-7xl mx-auto px-6 py-20">

      <div class="flex justify-between items-center flex-wrap gap-4 mb-12">

        <h2 class="text-4xl font-bold">
          Saved Favorites
        </h2>

        <a href="index.html"
          class="bg-accent hover:bg-purple-700 text-white px-6 py-3 rounded-2xl transition">
          Browse More Books
        </a>

      </div>

      <!-- FAVORITES GRID -->
      <div id="favoritesGrid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
      </div>

    </section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-primary text-center text-white py-8 mt-auto">

    <p class="text-lg">
      © 2026 Book Explorer | Read • Learn • Discover
    </p>

  </footer>

  <!-- JAVASCRIPT -->
  <script type="module">

    import {
      getFavorites,
      removeFavorite
    } from './js/favorites.js';

    const grid = document.getElementById('favoritesGrid');
    //This function loads and displays all favorite books.

    function renderFavorites() {

      const books = getFavorites();

      grid.innerHTML = '';

      if (books.length === 0) {

        grid.innerHTML = `
          <div class="col-span-full text-center">

            <h2 class="text-3xl font-bold mb-4">
              No Favorite Books Yet
            </h2>

            <p class="text-gray-600 dark:text-gray-300 mb-8">
              Start exploring books and save your favorites here.
            </p>

            <a href="index.html"
              class="bg-accent hover:bg-purple-700 text-white px-6 py-3 rounded-2xl transition">
              Explore Books
            </a>

          </div>
        `;
        //No need to create cards because there are no books.

        return;
      }
      //Processes one book at a time.

      books.forEach(book => {

        const card = document.createElement('div');

        card.className = `
          bg-white dark:bg-slate-900
          rounded-3xl overflow-hidden shadow-2xl
          hover:-translate-y-2 transition duration-300
        `;

        const imageUrl = book.cover_i
          ? `https://covers.openlibrary.org/b/id/${book.cover_i}-L.jpg`
          : 'https://via.placeholder.com/300x400?text=No+Image';

        card.innerHTML = `

          <img
            src="${imageUrl}"
            class="w-full h-80 object-cover"
          />

          <div class="p-6">

            <h2 class="text-2xl font-bold mb-4 line-clamp-2">
              ${book.title}
            </h2>

            <p class="text-gray-600 dark:text-gray-300 mb-6">
              ${book.author_name ? book.author_name[0] : 'Unknown Author'}
            </p>

            <button class="removeBtn bg-red-500 hover:bg-red-600 text-white px-5 py-3 rounded-xl w-full transition">
              Remove From Favorites
            </button>

          </div>
        `;

        card.querySelector('.removeBtn')
          .addEventListener('click', () => {

            removeFavorite(book.key);

            renderFavorites();
          });

        grid.appendChild(card);
      });

    }

    renderFavorites();

    // HAMBURGER MENU
    const menuBtn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');

    menuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });

    // DARK MODE
    const html = document.documentElement;

    const themeToggle = document.getElementById('themeToggle');
    const mobileThemeToggle = document.getElementById('mobileThemeToggle');

    function toggleTheme() {
      html.classList.toggle('dark');
    }

    themeToggle.addEventListener('click', toggleTheme);
    mobileThemeToggle.addEventListener('click', toggleTheme);

  </script>

</body>
</html>
