
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Explorer</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#0F172A',
            secondary: '#1E293B',
            accent: '#7C3AED',
            lightbg: '#E2E8F0',
            darkbg: '#020617'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-lightbg dark:bg-darkbg text-gray-900 dark:text-white transition duration-300 min-h-screen flex flex-col">


  <!-- NAVBAR -->
  <nav class="bg-primary shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4">

      <div class="flex justify-between items-center h-16">

        <h1 class="text-2xl font-bold text-white tracking-wide">
          Book Explorer
        </h1>

        <!-- Desktop Menu -->
        <div class="hidden md:flex items-center gap-6">
          <a href="index.html" class="text-white hover:text-accent transition">Home</a>
          <a href="favorites.html" class="text-white hover:text-accent transition">Favorites</a>
          <a href="about.html" class="text-white hover:text-accent transition">About</a>

          <button id="themeToggle"
            class="bg-accent hover:bg-purple-700 text-white px-4 py-2 rounded-xl transition">
            🌙
          </button>
        </div>

        <!-- Hamburger -->
        <button id="menuBtn" class="md:hidden text-white text-3xl">
          ☰
        </button>
      </div>

      <!-- Mobile Menu -->
      <div id="mobileMenu" class="hidden md:hidden pb-4 space-y-3">
        <a href="index.html" class="block text-white">Home</a>
        <a href="favorites.html" class="block text-white">Favorites</a>
        <a href="about.html" class="block text-white">About</a>

        <button id="mobileThemeToggle"
          class="bg-accent text-white px-4 py-2 rounded-xl w-full">
          Toggle Theme
        </button>
      </div>

    </div>
  </nav>

  <!-- HERO -->
  <section class="text-center py-20 px-6">

    <h2 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">
      Discover Amazing Books
    </h2>

    <p class="text-lg text-gray-600 dark:text-gray-300 max-w-2xl mx-auto mb-10">
      Search thousands of books using Open Library API and save your favorites.
    </p>

    <!-- SEARCH -->
    <div class="flex flex-col sm:flex-row justify-center gap-4">

      <input
        id="searchInput"
        type="text"
        placeholder="Search books by title..."
        class="px-5 py-3 rounded-2xl w-full sm:w-96 text-black outline-none shadow-lg"
      />

      <button
        id="searchBtn"
        class="bg-accent hover:bg-purple-700 text-white px-8 py-3 rounded-2xl shadow-lg transition">
        Search
      </button>

    </div>
  </section>

  <!-- LOADING -->
  <div id="loading" class="hidden text-center text-2xl font-bold pb-8">
    Loading books...
  </div>

  <!-- NO RESULTS -->
  <div id="noResults" class="hidden text-center text-xl pb-8">
    No books found.
  </div>

  <!-- BOOK GRID -->
  <main class="max-w-7xl mx-auto px-6 pb-20 flex-grow">

    <div id="bookGrid"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-primary text-center text-white py-6 mt-auto">
    <p>© 2026 Book Explorer.</p>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
